<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
<style>
@keyframes tw{0%,100%{transform:scale(1) rotate(0deg)}50%{transform:scale(1.25) rotate(20deg)}}
.tw{transform-origin:50% 50%;animation:tw 1.4s ease-in-out infinite}
@keyframes gl{0%,100%{opacity:.3}50%{opacity:1}}
.gl{animation:gl 1.4s infinite}
</style>
<g class="tw">
<path d="M50 6l9.5 21.5L82 28l-17 15 5 23-20-11-20 11 5-23-17-15 22.5-.5z" fill="#ffd93d"/>
</g>
<circle class="gl" cx="20" cy="25" r="4" fill="#fff" style="animation-delay:.2s"/>
<circle class="gl" cx="85" cy="45" r="3" fill="#fff" style="animation-delay:.5s"/>
<circle class="gl" cx="30" cy="80" r="4" fill="#fff" style="animation-delay:.8s"/>
</svg>